parameters:
  - name: artifactName
    type: string
    default: 'drop'
  - name: artifactContents
    type: string

stages:
  - stage: 'CI'
    displayName: 'Build'

    jobs:
      - template: ../jobs/python-build.yml
        parameters:
          artifactName: ${{ parameters.artifactName }}
          artifactContents: ${{ parameters.artifactContents }}
