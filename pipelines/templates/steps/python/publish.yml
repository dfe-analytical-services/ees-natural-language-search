parameters:
  artifactName: 'drop'

steps:
  # Git metadata, manually-run tools, the test suite and its output aren't needed by the deployed function app
  - task: CopyFiles@2
    displayName: 'Copy function app files'
    inputs:
      sourceFolder: '$(Build.SourcesDirectory)'
      contents: |
        **
        !.git/**
        !tools/**
        !tests/**
        !.pytest_cache/**
        !.coverage
        !coverage.xml
        !test-results.xml
      targetFolder: '$(Build.BinariesDirectory)/function-app'
      cleanTargetFolder: true
    condition: |
      and(
        succeeded(),
        eq(variables.shouldPublishArtifact, true)
      )

  - task: ArchiveFiles@2
    displayName: 'Create deployment artifact'
    inputs:
      rootFolderOrFile: '$(Build.BinariesDirectory)/function-app'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.Repository.Name)-$(Build.SourceBranchName)-$(Build.BuildNumber).zip'
      replaceExistingArchive: true
    condition: |
      and(
        succeeded(),
        eq(variables.shouldPublishArtifact, true)
      )

  - task: PublishPipelineArtifact@1
    displayName: 'Publish pipeline artifact'
    inputs:
      artifactName: '${{ parameters.artifactName }}'
      targetPath: '$(Build.ArtifactStagingDirectory)'
      publishLocation: 'pipeline'
    condition: |
      and(
        succeeded(),
        eq(variables.shouldPublishArtifact, true)
      )